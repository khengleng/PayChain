name: SDK Release

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to package and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SDK version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#sdk-v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine SDK version"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dart-lang/setup-dart@v1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Package SDK artifacts
        run: bash scripts/package-sdk-artifacts.sh "${{ steps.version.outputs.value }}" release-assets

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-release-assets
          path: release-assets/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sdk-v${{ steps.version.outputs.value }}
          name: SDK v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: release-assets/*
