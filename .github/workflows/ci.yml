name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup errors when it is set AND package.json has
      # packageManager. The lockfile's packageManager (pnpm@9.0.0) is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify SDK versions stay aligned
        run: bash scripts/verify-sdk-versions.sh

      - name: Generate Prisma client
        run: pnpm --filter @paychain/database exec prisma generate

      - name: Build packages
        run: pnpm -r --filter "./packages/**" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm -r test

      - name: Pack TypeScript SDK
        run: |
          mkdir -p /tmp/sdk-artifacts
          npm pack ./packages/sdk-typescript --pack-destination /tmp/sdk-artifacts

      # Unit tests and typecheck both pass while the Nest container is unresolvable — a DI cycle
      # or a misplaced provider only appears at boot, and the e2e that would catch it is skipped
      # without RUN_E2E=1. Without this step, production is where we would find out.
      - name: Boot module graph
        run: pnpm --filter @paychain/api test:boot

      - name: Build apps
        run: pnpm -r --filter "./apps/**" build

  sdk-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Validate Dart SDK
        working-directory: packages/sdk-dart
        run: |
          dart pub get
          dart run build_runner build
          dart analyze

  sdk-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP SDK
        working-directory: packages/sdk-php
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist
          composer test

  sdk-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Kotlin SDK
        working-directory: packages/sdk-kotlin
        run: |
          chmod +x gradlew
          ./gradlew test

  sdk-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate .NET SDK
        run: dotnet test packages/sdk-dotnet/PayChain.Sdk.sln --configuration Release

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` — pnpm/action-setup errors when it is set AND package.json has
      # packageManager. The lockfile's packageManager (pnpm@9.0.0) is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Dependency vulnerability scan (§41), best-effort (the pnpm audit endpoint can be
      # flaky/retired across versions). The ENFORCING dependency gate is Railway's deploy
      # scanner, which blocks vulnerable packages at deploy time (it caught next@14.2.5).
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level high

      # Secret scan (§41): reject committed private keys / obvious credentials.
      - name: Secret scan
        run: bash scripts/secret-scan.sh

  # Deploy to Railway (§39).
  #
  # Railway's GitHub integration was not deploying: for weeks every push landed on main and
  # nothing shipped, and a manual `railway up` could silently no-op. Deploying from CI instead
  # makes it explicit and auditable — you can see in the Actions log exactly what shipped and when.
  #
  # `needs` gates this on the build/test and security jobs, so a red build cannot deploy. That
  # matters more than usual here: CI itself was broken (pnpm setup errored before install), so
  # nothing had ever actually been tested before it went out.
  deploy:
    needs: [build-test, sdk-dart, sdk-php, sdk-kotlin, sdk-dotnet, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize deploys: two concurrent runs would race, and the api runs prisma migrate deploy
    # on start. cancel-in-progress is deliberately false — cancelling a half-finished migration
    # is worse than queueing behind it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # The api goes first and alone: its container runs `prisma migrate deploy` before serving,
      # so schema changes must land before the worker and portals start talking to the database.
      - name: Deploy api (runs migrations)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service paychain-api --ci

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service paychain-worker --ci

      - name: Deploy admin portal
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service paychain-admin --ci

      - name: Deploy developer portal
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service paychain-developer --ci

      # A deploy that "succeeded" but did not land is the failure mode we actually hit, twice.
      # Verifying the running service is the only way to know the push shipped.
      - name: Verify production is healthy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://api.paychain.cambobia.com/api/v1/health/ready || true)
            if [ "$code" = "200" ]; then echo "api healthy"; exit 0; fi
            echo "waiting for api (got $code)…"; sleep 10
          done
          echo "::error::api did not become healthy after deploy"; exit 1
