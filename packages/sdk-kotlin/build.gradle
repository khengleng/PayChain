group 'com.paychain'
version '0.1.0'
description = 'PayChain Kotlin SDK for the public API'

wrapper {
    gradleVersion = '8.14.3'
    distributionUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-all.zip"
}

buildscript {
    ext.kotlin_version = '2.2.20'
    ext.spotless_version = "7.2.1"

    repositories {
        maven { url "https://repo1.maven.org/maven2" }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.diffplug.spotless:spotless-plugin-gradle:$spotless_version"
    }
}

apply plugin: 'kotlin'
apply plugin: 'maven-publish'
apply plugin: 'com.diffplug.spotless'

compileKotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}

compileTestKotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}

repositories {
    maven { url "https://repo1.maven.org/maven2" }
}

// Use spotless plugin to automatically format code, remove unused import, etc
// To apply changes directly to the file, run `gradlew spotlessApply`
// Ref: https://github.com/diffplug/spotless/tree/main/plugin-gradle
spotless {
    // comment out below to run spotless as part of the `check` task
    enforceCheck false

    format 'misc', {
        // define the files (e.g. '*.gradle', '*.md') to apply `misc` to
        target '.gitignore'

        // define the steps to apply to those files
        trimTrailingWhitespace()
        indentWithSpaces() // Takes an integer argument if you don't like 4
        endWithNewline()
    }
    kotlin {
        ktfmt()
    }
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    implementation "com.squareup.moshi:moshi-adapters:1.15.2"
    implementation "com.squareup.okhttp3:okhttp:5.1.0"
    testImplementation "io.kotlintest:kotlintest-runner-junit5:3.4.2"
}

java {
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.paychain'
            artifactId = 'paychain-sdk-kotlin'
            version = '0.1.0'
            from components.java

            pom {
                name = 'PayChain Kotlin SDK'
                description = 'Generated Kotlin SDK for the PayChain public API.'
                url = 'https://developer.paychain.cambobia.com'

                licenses {
                    license {
                        name = 'PayChain Commercial SDK License'
                        url = 'https://developer.paychain.cambobia.com/legal/sdk-license'
                    }
                }

                scm {
                    url = 'https://developer.paychain.cambobia.com/sdk'
                    connection = 'scm:git:https://developer.paychain.cambobia.com/sdk'
                    developerConnection = 'scm:git:https://developer.paychain.cambobia.com/sdk'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'paychainPrivate'
            url = uri(System.getenv('PAYCHAIN_MAVEN_URL') ?: 'https://packages.paychain.cambobia.com/maven/releases')
            credentials {
                username = System.getenv('PAYCHAIN_MAVEN_USERNAME')
                password = System.getenv('PAYCHAIN_MAVEN_PASSWORD')
            }
        }
    }
}
